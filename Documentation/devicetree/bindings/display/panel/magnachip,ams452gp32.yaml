%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/magnachip,ams452gp32.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Magnachip AMS452GP32 WVGA OLED panel

description: |
  Magnachip AMS452GP32 (SMD_AMS452GP32) 480x800 WVGA OLED panel.
  MIPI-DSI video mode, 2 lanes, RGB888. Used on Samsung Express Att (SGH-I437).

maintainers:
  - linux-arm-msm@vger.kernel.org

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: magnachip,ams452gp32

  reg:
    maxItems: 1

  port: true
  reset-gpios: true
  enable-gpios: true
  vddp-supply:
    description: panel power supply
  iovcc-supply:
    description: I/O voltage supply
  dcdc-en-gpios:
    maxItems: 1
    description: optional DCDC enable GPIO (e.g. PMIC GPIO)

  pinctrl-names: true
  pinctrl-0: true

required:
  - compatible
  - reg
  - port
  - reset-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "magnachip,ams452gp32";
            reg = <0>;

            vddp-supply = <&pm8921_l17>;
            iovcc-supply = <&pm8921_lvs7>;
            reset-gpios = <&pm8921_gpio 43 GPIO_ACTIVE_LOW>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi0_out>;
                };
            };
        };
    };
